{% extends "base.html" %}
{% block title %}Admin — {{ app_name }}{% endblock %}
{% block content %}
<div class="admin-container">
    <p><a class="admin-back" href="/">← Back to site</a></p>
    <h1>Admin</h1>
    <p class="admin-note">Choose a panel to manage it.</p>
    <nav class="admin-panels admin-panels-landing">
        {% for label, href in panels %}
        <a class="admin-panel-link" href="{{ href }}">{{ label }}</a>
        {% endfor %}
    </nav>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
</div>
{% endblock %}
